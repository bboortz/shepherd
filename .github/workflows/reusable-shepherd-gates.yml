---
# Shepherd auto-merge gates (SH-009 R1-C). Called by managed repos via:
#
#   jobs:
#     gates:
#       uses: bboortz/shepherd/.github/workflows/reusable-shepherd-gates.yml@<sha>
#       with:
#         pr_number: <PR number>
#
# Evaluates shepherd-agent-labelled PRs. Gates (in order; first failure
# short-circuits and opens a needs-human issue):
#
#   gate.diff-size                  — non-lockfile line count ≤ max_diff_lines
#   gate.pipelines-green            — monitored pipelines are terminal-success
#   gate.scan-not-worse             — PR adds no HIGH/CRITICAL vs base
#   gate.security-fix-removes-finding — strict: shepherd-security-fix PRs must
#                                       remove ≥1 finding
#
# When all pass and .shepherd.yml opts in, calls gh pr merge --auto --merge.
# Always exits 0; decisions encoded as ::notice:: annotations (SH-011 pattern).

name: reusable-shepherd-gates

"on":
  workflow_call:
    inputs:
      pr_number:
        description: "PR number (caller resolves from event context)"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Guard — PR number present
        shell: bash
        run: |
          if [ -z "${PR_NUMBER:-}" ] || [ "$PR_NUMBER" = "0" ]; then
            echo "::notice::auto-merge decision: no PR context (pr_number=0) — likely a workflow_run from a push-triggered workflow; nothing to gate"
            exit 0
          fi
          echo "evaluating gates for PR #$PR_NUMBER on $REPO"

      - name: Resolve PR head/base SHAs
        id: pr
        shell: bash
        run: |
          [ "$PR_NUMBER" = "0" ] && exit 0
          json=$(gh pr view "$PR_NUMBER" -R "$REPO" --json headRefOid,baseRefOid,baseRefName,labels,title)
          echo "head=$(echo "$json" | jq -r .headRefOid)"       >> "$GITHUB_OUTPUT"
          echo "base=$(echo "$json" | jq -r .baseRefOid)"       >> "$GITHUB_OUTPUT"
          echo "base_name=$(echo "$json" | jq -r .baseRefName)" >> "$GITHUB_OUTPUT"
          echo "labels<<EOF"                                    >> "$GITHUB_OUTPUT"
          echo "$json" | jq -r '.labels[].name'                 >> "$GITHUB_OUTPUT"
          echo "EOF"                                            >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        if: steps.pr.outputs.head != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head }}
          path: head
          fetch-depth: 1

      - name: Checkout base
        if: steps.pr.outputs.base != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.base }}
          path: base
          fetch-depth: 1

      - name: Checkout shepherd scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: bboortz/shepherd
          ref: ${{ github.job_workflow_sha }}
          path: _shepherd

      - name: Verify .shepherd.yml present
        if: steps.pr.outputs.head != ''
        run: ./_shepherd/scripts/shepherd-poc/verify-shepherd-yml.sh head

      - name: Install Trivy (sigstore-verified)
        if: steps.pr.outputs.head != ''
        run: ./_shepherd/scripts/shepherd-poc/install-trivy.sh

      - name: Trivy scan — PR head
        if: steps.pr.outputs.head != ''
        working-directory: head
        run: |
          trivy fs \
            --file-patterns 'pip:requirements.*\.txt$' \
            --include-deprecated-checks \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output /tmp/head-findings.json \
            --exit-code 0 \
            .

      - name: Trivy scan — base
        if: steps.pr.outputs.base != ''
        working-directory: base
        run: |
          trivy fs \
            --file-patterns 'pip:requirements.*\.txt$' \
            --include-deprecated-checks \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output /tmp/base-findings.json \
            --exit-code 0 \
            .

      - name: Evaluate gates + enable auto-merge
        if: steps.pr.outputs.head != ''
        shell: bash
        env:
          LABELS: ${{ steps.pr.outputs.labels }}
          BASE_NAME: ${{ steps.pr.outputs.base_name }}
        run: |
          set -euo pipefail

          # --- decision() always exits 0; needs-human called on failure ----
          decision() {
            echo "::notice::auto-merge decision: $1"
            exit 0
          }
          escalate() {
            # $1 = gate name, $2 = reason, $3 = extra context file (optional)
            ./_shepherd/scripts/shepherd-poc/open-needs-human.sh "$1" "$PR_NUMBER" "$2" "${3:-}" || true
            decision "gate.$1 FAIL — $2 — opened needs-human issue"
          }

          # Shepherd-hold escape hatch.
          if echo "$LABELS" | grep -Fxq 'shepherd-hold'; then
            decision "shepherd-hold label present — leaving PR open (no needs-human)"
          fi

          # --- Read .shepherd.yml knobs (flat-scalar parse) ----------------
          cfg=head/.shepherd.yml
          get_scalar() {
            grep -E "^[[:space:]]*$1:" "$cfg" | head -1 \
              | sed -E 's/^[[:space:]]*[a-z_]+:[[:space:]]*//; s/[[:space:]]*#.*$//; s/^"//; s/"$//'
          }
          max_diff_lines=$(get_scalar max_diff_lines); : "${max_diff_lines:=50}"
          monitored=$(get_scalar monitored_pipelines); : "${monitored:=all}"
          rescan_scope=$(get_scalar rescan_scope);     : "${rescan_scope:=high_critical}"
          auto_merge_patch=$(grep -E '^[[:space:]]+patch:' "$cfg" | head -1 | grep -Eo '(true|false)' || echo true)
          auto_merge_minor=$(grep -E '^[[:space:]]+minor:' "$cfg" | head -1 | grep -Eo '(true|false)' || echo true)
          auto_merge_major=$(grep -E '^[[:space:]]+major:' "$cfg" | head -1 | grep -Eo '(true|false)' || echo false)
          echo "config: max_diff_lines=$max_diff_lines monitored=$monitored rescan_scope=$rescan_scope auto_merge=$auto_merge_patch/$auto_merge_minor/$auto_merge_major"

          # --- gate.diff-size ---------------------------------------------
          mkdir -p /tmp/sh-009
          gh pr diff "$PR_NUMBER" -R "$REPO" > /tmp/sh-009/pr.diff
          non_lockfile_lines=$(./_shepherd/scripts/shepherd-poc/gate-diff-size.sh /tmp/sh-009/pr.diff --non-lockfile)
          echo "gate.diff-size: non-lockfile=$non_lockfile_lines cap=$max_diff_lines"
          if [ "$non_lockfile_lines" -gt "$max_diff_lines" ]; then
            echo "$non_lockfile_lines non-lockfile lines (cap $max_diff_lines)" > /tmp/sh-009/ctx
            escalate diff-size "diff exceeds non-lockfile cap" /tmp/sh-009/ctx
          fi

          # --- gate.pipelines-green ---------------------------------------
          gh pr checks "$PR_NUMBER" -R "$REPO" --json name,state --jq '.[] | "\(.name) \(.state)"' > /tmp/sh-009/checks || true
          echo "pipeline status:"
          sed 's/^/  /' /tmp/sh-009/checks 2>/dev/null || echo "  (none)"

          if [ ! -s /tmp/sh-009/checks ]; then
            decision "pipelines not reported yet — will re-fire on next synchronize/label/workflow_run"
          fi

          if [ "$monitored" = "all" ]; then
            names=$(awk '{print $1}' /tmp/sh-009/checks)
          else
            names=$(echo "$monitored" | sed 's/[][,]/ /g')
          fi

          bad=""
          for name in $names; do
            # Skip our own job name to avoid self-blocking (the gates workflow
            # itself appears as a check and is still in_progress when it runs).
            case "$name" in gates|shepherd-gates*) continue ;; esac
            state=$(awk -v n="$name" '$1 == n {print $2; exit}' /tmp/sh-009/checks)
            if [ -z "$state" ]; then
              bad="$bad $name=MISSING"
            elif [ "$state" != "SUCCESS" ] && [ "$state" != "NEUTRAL" ] && [ "$state" != "SKIPPED" ]; then
              bad="$bad $name=$state"
            fi
          done
          if [ -n "$bad" ]; then
            # Pending/running checks are not "failures" — defer the gate.
            # Everything in "bad" that's PENDING/IN_PROGRESS → defer.
            # Anything else (FAILURE/ERROR/CANCELLED) → escalate.
            hard_fail=0
            for entry in $bad; do
              state=${entry##*=}
              case "$state" in
                PENDING|IN_PROGRESS|QUEUED|MISSING) ;;
                *) hard_fail=1 ;;
              esac
            done
            if [ "$hard_fail" = "1" ]; then
              printf '%s\n' $bad > /tmp/sh-009/ctx
              escalate pipelines-green "one or more required pipelines failed" /tmp/sh-009/ctx
            else
              decision "pipelines-green PENDING —$bad — leaving PR open; re-fires on workflow_run/synchronize"
            fi
          fi
          echo "gate.pipelines-green: ok"

          # --- gate.scan-not-worse ----------------------------------------
          case "$rescan_scope" in
            all|ALL) sev_arg=ALL ;;
            *)       sev_arg=HIGH,CRITICAL ;;
          esac
          diff_json=$(./_shepherd/scripts/shepherd-poc/scan-not-worse.sh /tmp/base-findings.json /tmp/head-findings.json "$sev_arg") || snw_rc=$?
          snw_rc=${snw_rc:-0}
          echo "scan-not-worse: $diff_json"
          if [ "$snw_rc" = "2" ]; then
            printf '%s\n' "$diff_json" > /tmp/sh-009/ctx
            escalate scan-not-worse "PR introduces new findings vs base" /tmp/sh-009/ctx
          fi

          # --- gate.security-fix-removes-finding (strict — part 2) --------
          if echo "$LABELS" | grep -Fxq 'shepherd-security-fix'; then
            removed=$(echo "$diff_json" | jq -r .removed)
            echo "gate.security-fix-removes-finding: removed=$removed"
            if [ "${removed:-0}" -lt "1" ]; then
              printf '%s\n' "$diff_json" > /tmp/sh-009/ctx
              escalate security-fix-removes-finding "shepherd-security-fix PR did not remove any HIGH/CRITICAL finding" /tmp/sh-009/ctx
            fi
          fi

          # --- Auto-merge opt-in check ------------------------------------
          # Part-2 placeholder: use "patch" semantics. Explicit bump-level
          # classification from the agent lands in a follow-up ship.
          level=patch
          case "$level" in
            patch) [ "$auto_merge_patch" = "false" ] && decision "patch bump + auto_merge.patch=false — leaving PR open" ;;
            minor) [ "$auto_merge_minor" = "false" ] && decision "minor bump + auto_merge.minor=false — leaving PR open" ;;
            major) [ "$auto_merge_major" = "false" ] && decision "major bump + auto_merge.major=false — leaving PR open" ;;
          esac

          echo "all gates green — enabling auto-merge"
          if err=$(gh pr merge "$PR_NUMBER" -R "$REPO" --auto --merge 2>&1); then
            echo "::notice::auto-merge decision: enabled for PR #$PR_NUMBER"
          else
            case "$err" in
              *"Protected branch rules not configured"*)
                decision "auto-merge needs branch protection on base; set one required status check, then rebase this PR" ;;
              *"Pull request is already merged"*|*"Pull request is in clean state"*)
                decision "PR already merged or in clean state — exiting ok" ;;
              *)
                echo "::warning::auto-merge enable failed: $err"
                decision "auto-merge enable failed; see workflow log" ;;
            esac
          fi
