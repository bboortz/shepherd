---
# Dev-cycle contract (SH-014) — tier 2: patch-after-merge on dev/main.
# Budget: 5 minutes wall-clock. NEVER rebuilds; re-smokes the ci-branch
# artifact keyed by commit SHA.
#
# Copy this file to .github/workflows/ci-patch.yml in your managed repo.
#
# Spec: docs/specs/dev-cycle-contract.md
name: ci-patch

"on":
  push:
    branches: [dev, main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5    # hard budget cap (SH-014).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # SH-034: Zig needed for `make smoke` → `make test-acceptance` →
      # `make build`. Same install pattern as ci-branch.
      - name: Install Zig 0.17.1
        run: |
          set -eu
          cd /tmp
          curl -fsSL -o zig.tar.xz https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz
          echo "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a  zig.tar.xz" | sha256sum -c -
          tar -xJf zig.tar.xz
          echo "/tmp/zig-x86_64-linux-0.17.1" >> "$GITHUB_PATH"

      # Build-once-promote (SH-014): download the artifact produced by
      # ci-branch at ${{ github.sha }}. If the artifact is missing (eg. a
      # fresh branch with no prior PR), the step soft-fails and `make smoke`
      # runs against the current checkout. For image repos, override `smoke`
      # to `docker pull ghcr.io/<repo>:sha-<commit>` instead.
      - name: Download release artifacts from ci-branch
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-sha-${{ github.sha }}
          path: build/release/

      - name: Run patch-tier gate
        id: patch
        run: make ci-patch

      - name: Upload ci-timing.json
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ci-timing-patch
          path: build/ci-timing.json
          if-no-files-found: ignore

      # SH-028 auto-revert decision. Runs only when the patch-tier gate failed
      # AND .shepherd.yml opts in. decide is pure; execute is gated on the
      # decision. Blocklist short-circuit routes to needs-human instead.
      - name: Auto-revert decision (SH-028)
        if: failure() && steps.patch.conclusion == 'failure'
        id: autorevert_decide
        run: |
          set -eu
          git diff-tree --no-commit-id --name-only -r "${{ github.sha }}" > /tmp/sh-028-files.txt
          if [ ! -f .shepherd.yml ]; then
            echo "decision=SKIP:no-shepherd-yml" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          decision=$(scripts/shepherd-poc/auto-revert.sh decide .shepherd.yml /tmp/sh-028-files.txt | head -1)
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "auto-revert decision: $decision"

      - name: Auto-revert execute (SH-028)
        if: |
          failure()
          && steps.patch.conclusion == 'failure'
          && startsWith(steps.autorevert_decide.outputs.decision, 'REVERT:')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          mode="comment-only"
          case "${{ steps.autorevert_decide.outputs.decision }}" in
            REVERT:auto-merge) mode="auto-merge" ;;
          esac
          git config user.name  "shepherd-bot[bot]"
          git config user.email "shepherd-bot@users.noreply.github.com"
          scripts/shepherd-poc/auto-revert.sh execute "${{ github.sha }}" "$mode"

      - name: Auto-revert needs-human (SH-028 blocklist short-circuit)
        if: |
          failure()
          && steps.patch.conclusion == 'failure'
          && steps.autorevert_decide.outputs.decision == 'SKIP:touches-blocklist'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          scripts/shepherd-poc/open-needs-human.sh \
            "auto-revert-blocklisted" 0 \
            "ci-patch failed on ${{ github.sha }} but the revert would touch a blocklisted path — refusing to open the revert PR."
