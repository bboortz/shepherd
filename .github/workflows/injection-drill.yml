---
# SH-005 prompt-injection drill: block merge on any regression in the trust
# boundary. Pure replay — no secrets, no network, no PR writes.

name: injection-drill

"on":
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run SH-005 injection drill
        run: make injection-drill
