---
name: reusable-verify

"on":
  workflow_call: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Load .shepherd.yml
        id: cfg
        run: |
          if [ ! -f .shepherd.yml ]; then
            echo "::error ::.shepherd.yml missing — repo is not onboarded to Shepherd"
            exit 1
          fi
          {
            echo "build=$(yq -r '.build' .shepherd.yml)"
            echo "test=$(yq -r '.test' .shepherd.yml)"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        run: ${{ steps.cfg.outputs.build }}

      - name: Test
        run: ${{ steps.cfg.outputs.test }}

      - name: Trivy filesystem scan
        # SHA-pinned per GHSA-69fq-xp46-6x23 / CVE-2026-33634 (TeamPCP March 2026
        # supply-chain attack force-pushed 76/77 trivy-action tags to malware).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
