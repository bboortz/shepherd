---
# Shepherd managed-repo config — schema v1 (SH-009).
# Required in every managed repo (SH-007). The reusable Action verifies
# presence; this file carries per-repo overrides for the §12 trust-boundary
# defaults.
schema_version: 1
version: 1              # legacy alias for schema_version — do not remove until R2.

risk: low               # low | medium | high
build: make build
test: make test

# Auto-merge policy for shepherd-agent-produced PRs. SH-009 gates are evaluated
# against these before merging.
auto_merge:
  patch: true
  minor: true
  major: false

# SH-009 gate configuration.
#   monitored_pipelines: list of required-check names that gate.pipelines-green
#     waits on. "all" (default) = every required branch-protection check.
#   max_diff_lines: cap for gate.diff-size (non-lockfile only — lockfile paths
#     are exempt, see validate.sh LOCKFILE_RE).
#   rescan_scope: severity scope for gate.scan-not-worse (part 2).
#   dry_run: when true, the agent produces a diff + comment on the PR but
#     does NOT open a merging PR. Default false — flips to true automatically
#     on a repo's first-ever run (onboarding.dry-run-first, part 2).
gates:
  monitored_pipelines: all
  max_diff_lines: 50
  rescan_scope: high_critical   # high_critical | all
  waiting_period_hours: 24      # 0 disables gate.waiting-period (SH-010)

dry_run: false

# Needs-human escalation. Issues opened on gate failure; dedupe by
# (package, cve, gate) hash. Part 2.
needs_human_label: needs-human

security_fix: pr-only  # pr-only | auto-merge-low-risk
notify: ntfy
owner: benni

# Dependabot baseline (SH-011). Shepherd enforces that managed repos have
# a well-formed .github/dependabot.yml; opt into gated auto-merge per repo.
dependabot:
  enforce_enabled: true   # shepherd-bump --verify-dependabot checks presence + shape
  auto_merge: false       # if true, patch+minor Dependabot PRs auto-merge after
                          # §12 gates (≤50 lines + ≥24h since release + CI green).
                          # gate.scan-not-worse is deferred to SH-009.

# Dev-cycle contract (SH-014 umbrella). Takes effect when SH-017 lands.
contract:
  enforce_enabled: true   # shepherd-bump --verify-contract checks the eight
                          # Makefile contract targets (build, test, test-affected,
                          # smoke, release-artifacts, ci-branch, ci-patch,
                          # ci-release, ci-nightly). Opt out with `false`.

# Risk-paths (SH-027). Distinct from the §12 blocklist: these paths are
# AGENT-WRITABLE but a human MUST approve before auto-merge. Use for
# sensitive-but-editable files: remediation logic, network roles, Dockerfiles.
risk_paths: []            # [glob, ...] — a PR touching any match cannot auto-merge.

# Auto-revert (SH-028). Opt-in automatic revert PR on ci-patch failure.
# Phase 1 default is comment_only: true — opens the revert PR but does NOT
# auto-merge it. Flip to false once the shape is proven.
auto_revert:
  enabled: false
  comment_only: true
