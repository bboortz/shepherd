---
# Shepherd gates caller (SH-009 part 1). Acts on shepherd-agent-labelled PRs.
# `workflow_run` re-fire deferred to part 2 (needs workflow-name filtering
# and PR-number resolution that can't be done cleanly from a push-event
# workflow_run). For part 1, gates re-evaluate on `synchronize` + `labeled`.
# Pin @main to a tagged SHA from R1 onward.
name: shepherd-gates
"on":
  pull_request:
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: write
  pull-requests: write
jobs:
  gates:
    if: contains(github.event.pull_request.labels.*.name, 'shepherd-agent')
    uses: bboortz/shepherd/.github/workflows/reusable-shepherd-gates.yml@main
    with:
      pr_number: ${{ github.event.pull_request.number }}
